<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="One plus i and one minus i are reflected in the real axis" style="width:100%;height:auto"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#164963"/></marker></defs><rect width="640" height="360" fill="white"/><g font-family="Arial,sans-serif" font-size="19" fill="#172f40"><path d="M45 170L575 170" stroke="#164963" stroke-width="1.2" fill="none" /><path d="M155 40L155 265" stroke="#164963" stroke-width="1.2" fill="none" /><path d="M155 170L255 70" stroke="#164963" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M155 170L255 270" stroke="#164963" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M255 70L255 270" stroke="#164963" stroke-width="1.2" fill="none"  stroke-dasharray="5 5"/><text x="265" y="73" font-size="19">1 + i</text><text x="265" y="280" font-size="19">1 − i</text><text x="565" y="156" font-size="19">Re</text><text x="165" y="42" font-size="19">Im</text><text x="130" y="193" font-size="19">O</text><text x="377" y="104" font-size="19">Reflect in</text><text x="377" y="131" font-size="19">the real axis.</text><text x="70" y="327" font-size="22">(1 + i)(1 − i) = 1² + 1² = 2</text></g></svg>