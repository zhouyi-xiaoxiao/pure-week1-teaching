<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="t d" style="max-width:100%;height:auto"><title id="t">Six vectors from Question 1.2</title><desc id="d">Arrows from the origin to (2,5),(-2,5),(0,2),(0,-2),(-1,-5). The zero vector is the origin. Reflections preserve lengths.</desc><rect width="640" height="640" fill="#f7fafc"/><path d="M55 320H595 M320 35V600" stroke="#75869a" stroke-width="2"/><g stroke="#176fa5" stroke-width="3" fill="#176fa5"><path d="M320 320L408 100 M320 320L232 100 M320 320V232 M320 320V408 M320 320L276 540"/><circle cx="408" cy="100" r="5"/><circle cx="232" cy="100" r="5"/><circle cx="320" cy="232" r="5"/><circle cx="320" cy="408" r="5"/><circle cx="276" cy="540" r="5"/></g><circle cx="320" cy="320" r="6" fill="#bd721b"/><g font-family="sans-serif" font-size="18" fill="#12334d"><text x="417" y="96">v₁ (2,5)</text><text x="122" y="88">v₂ (−2,5)</text><text x="337" y="233">v₃ (0,2)</text><text x="337" y="410">v₄ (0,−2)</text><text x="143" y="563">v₅ (−1,−5)</text><text x="345" y="345">v₆ = 0</text><text x="575" y="310">x</text><text x="335" y="50">y</text><text x="55" y="619">Each vector starts at the origin; the zero vector has length 0.</text></g></svg>
