<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="The equation w minus y equals y minus u makes Y the midpoint of U and W" style="width:100%;height:auto"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#164963"/></marker></defs><rect width="640" height="360" fill="white"/><g font-family="Arial,sans-serif" font-size="19" fill="#172f40"><path d="M60 85L570 85" stroke="#164963" stroke-width="1.2" fill="none" /><path d="M90 35L90 305" stroke="#164963" stroke-width="1.2" fill="none" /><path d="M450 85L315 175" stroke="#164963" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M315 175L180 265" stroke="#164963" stroke-width="3" fill="none" marker-end="url(#arrow)"/><circle cx="450" cy="85" r="5" fill="#164963"/><circle cx="315" cy="175" r="5" fill="#164963"/><circle cx="180" cy="265" r="5" fill="#164963"/><text x="470" y="75" font-size="19">U = (4, 0)</text><text x="320" y="205" font-size="19">Y = (5/2, −1)</text><text x="85" y="293" font-size="19">W = (1, −2)</text><text x="355" y="142" font-size="19">y − u</text><text x="195" y="206" font-size="19">w − y</text><text x="66" y="109" font-size="19">O</text><text x="573" y="78" font-size="19">x</text><text x="70" y="36" font-size="19">y</text><text x="60" y="331" font-size="19">U → Y and Y → W: equal displacement, same direction.</text></g></svg>