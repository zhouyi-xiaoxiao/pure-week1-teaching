<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Positive horizontal vector angle zero and downward vector angle three pi over two" style="width:100%;height:auto"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#164963"/></marker></defs><rect width="640" height="360" fill="white"/><g font-family="Arial,sans-serif" font-size="19" fill="#172f40"><path d="M30 130L275 130" stroke="#164963" stroke-width="1.2" fill="none" /><path d="M105 235L105 40" stroke="#164963" stroke-width="1.2" fill="none" /><path d="M105 130L210 130" stroke="#164963" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="130" y="110" font-size="19">(3, 0)</text><text x="50" y="275" font-size="19">r = 3, θ = 0</text><path d="M355 130L615 130" stroke="#164963" stroke-width="1.2" fill="none" /><path d="M455 250L455 25" stroke="#164963" stroke-width="1.2" fill="none" /><path d="M455 130L455 235" stroke="#164963" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M510 130 A55 55 0 1 0 455 185" stroke="#986119" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="476" y="229" font-size="19">(0, −3)</text><text x="364" y="275" font-size="19">r = 3, θ = 3π/2</text><text x="31" y="35" font-size="18">A positive radius; angles measured anticlockwise.</text><text x="53" y="329" font-size="18">−π/2 points down too, but is outside [0, 2π).</text></g></svg>