<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img" aria-labelledby="t d" style="max-width:100%;height:auto"><title id="t">Second and third roots of unity</title><desc id="d">For n=2 the roots are 1 and minus 1 on a unit circle. For n=3 they are 1 and minus one half plus or minus i square root of three over two, equally spaced at angles zero, two pi over three and four pi over three.</desc><rect width="680" height="350" fill="#f7fafc"/><g stroke="#8da2b8" fill="none"><circle cx="165" cy="170" r="100"/><circle cx="500" cy="170" r="100"/><path d="M40 170H290 M165 45V295 M375 170H625 M500 45V295"/></g><g fill="#176fa5"><circle cx="65" cy="170" r="6"/><circle cx="265" cy="170" r="6"/><circle cx="600" cy="170" r="6"/><circle cx="450" cy="83.4" r="6"/><circle cx="450" cy="256.6" r="6"/></g><g font-family="sans-serif" font-size="19" fill="#12334d"><text x="138" y="30">n = 2</text><text x="471" y="30">n = 3</text><text x="46" y="202">−1</text><text x="265" y="202">1</text><text x="603" y="202">1</text><text x="326" y="68">−1/2 + i√3/2</text><text x="327" y="292">−1/2 − i√3/2</text><text x="50" y="333">All roots have modulus 1; neighbouring angles differ by 2π/n.</text></g></svg>
