<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="A vector of length five at angle pi over four with equal Cartesian components" style="width:100%;height:auto"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#164963"/></marker></defs><rect width="640" height="360" fill="white"/><g font-family="Arial,sans-serif" font-size="19" fill="#172f40"><path d="M85 275L560 275" stroke="#164963" stroke-width="1.2" fill="none" /><path d="M135 315L135 40" stroke="#164963" stroke-width="1.2" fill="none" /><path d="M135 275L340 70" stroke="#164963" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M340 70L340 275" stroke="#164963" stroke-width="1.2" fill="none"  stroke-dasharray="5 5"/><path d="M135 70L340 70" stroke="#164963" stroke-width="1.2" fill="none"  stroke-dasharray="5 5"/><path d="M205 275 A70 70 0 0 0 184.5 225.5" stroke="#986119" stroke-width="2" fill="none"/><text x="208" y="253" font-size="19">π/4</text><text x="216" y="147" font-size="19">r = 5</text><text x="351" y="70" font-size="19">P</text><text x="215" y="305" font-size="19">5/√2</text><text x="40" y="170" font-size="19">5/√2</text><text x="108" y="298" font-size="19">O</text><text x="567" y="280" font-size="19">x</text><text x="118" y="33" font-size="19">y</text><text x="95" y="345" font-size="19">First draw direction; then length; then project onto axes.</text></g></svg>