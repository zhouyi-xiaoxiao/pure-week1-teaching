<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d" style="max-width:100%;height:auto"><title id="t">Argand diagram for 2 minus i</title><desc id="d">The point has real coordinate 2 and imaginary coordinate minus 1, in quadrant four. Its distance from the origin is square root of 5. The angle from the positive real axis is negative arctan one half.</desc><rect width="640" height="400" fill="#f7fafc"/><g stroke="#75869a" stroke-width="2"><path d="M70 190H590 M210 40V350"/></g><g fill="#334e68" font-family="sans-serif" font-size="18"><text x="565" y="175">Re</text><text x="220" y="55">Im</text><text x="189" y="213">0</text><text x="444" y="180">2</text><text x="173" y="319">−1</text></g><path d="M450 190V310H210" stroke="#8ca5bc" stroke-dasharray="6 5" fill="none"/><path d="M210 190L450 310" stroke="#176fa5" stroke-width="4"/><circle cx="450" cy="310" r="6" fill="#176fa5"/><path d="M278 190A68 68 0 0 1 271 220" stroke="#bb701e" stroke-width="3" fill="none"/><g font-family="sans-serif" font-size="19" fill="#12334d"><text x="465" y="325">2 − i</text><text x="320" y="235">r = √5</text><text x="245" y="347">θ = −arctan(1/2)</text><text x="45" y="380">Equivalent angle in [0, 2π): 2π − arctan(1/2)</text></g></svg>
